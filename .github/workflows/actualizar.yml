# Dispara un rebuild diario en Netlify para recoger los cambios de la hoja.
# Diego publica escribiendo en Google Sheets: no tiene que tocar nada más.
#
# Netlify ya ejecuta "node build.mjs" en cada build (ver netlify.toml), así
# que este workflow no toca el repositorio ni genera commits: solo le avisa
# a Netlify que vuelva a construir el sitio.

name: Actualizar el sitio desde la hoja

on:
  schedule:
    # 11:00 UTC = 06:00 en Ecuador, de lunes a domingo
    - cron: '0 11 * * *'
  workflow_dispatch:        # botón para lanzarlo a mano cuando haga falta

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar el rebuild en Netlify
        run: curl -fsS -X POST "$NETLIFY_BUILD_HOOK"
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
